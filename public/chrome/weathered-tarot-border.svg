<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100" preserveAspectRatio="none" fill="none" stroke="#9C9890" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">

  <!-- Claude Design v7 wobble character. Centerline inset to 2.0..98.0 (was
       0.16..99.84) so the full stroke lands INSIDE the viewBox instead of
       half-clipping at the raster edge — that clipping was the bulk of the old
       "washed out" look. Wobble pattern, Q control points, and corner shape are
       preserved 1:1 (linear map of the original coords). stroke-width 1.3 is the
       tuned weight: crisp but light (0.9 washed out via the clipping; 2.6 read
       too heavy). NOTE: this stroke-width drives ONLY the in-app `.card::before`
       border-image. The OG share Frame (build-card.ts) re-wraps the inner path
       in its own <svg stroke-width="0.9">, so it is unaffected. -->
