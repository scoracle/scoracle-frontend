<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="none" fill="none" stroke="#9C9890" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round">

  <!-- Claude Design v7 wobble character, with path coords linearly scaled
       from the source 6-94 range to the viewBox edges (~0.1-99.9). The
       wobble pattern, Q control points, and corner shape are preserved
       1:1; only the centerline position is shifted to the SVG bounds so
       the stroke renders close to the card edge (instead of ~6% inset).
       Combined with .card::before's `inset: 6px` CSS, the stroke ends up
       ~7-9px from the card outer edge — outside the corner numerals
       (top: 8/14, etc.) so the border is genuinely the outermost element. -->
